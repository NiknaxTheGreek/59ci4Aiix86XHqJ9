name: MonReader export verified Big-LaMa model

on:
  workflow_dispatch:
  push:
    branches: ["phase/v2-11c-project4-iterative-calibration20"]
    paths:
      - ".github/workflows/export_big_lama_model.yml"

permissions:
  contents: read

env:
  LAMA_MODEL_SHA256: 7ba7aa7ac37a4d41fdbbeba3a2af7ead18058552997e3a3cd1a3b2210c9e6b4c

jobs:
  export-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify Big-LaMa
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://github.com/enesmsahin/simple-lama-inpainting/releases/download/v0.1.0/big-lama.pt"             --output /tmp/big-lama.pt
          echo "$LAMA_MODEL_SHA256  /tmp/big-lama.pt" | sha256sum --check
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: verified-big-lama-model
          path: /tmp/big-lama.pt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
