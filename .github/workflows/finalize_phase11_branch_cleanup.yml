name: Finalize Phase 11 branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize_phase11_branch_cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged Phase 11 finalization branch
        run: |
          set -euo pipefail
          git push origin --delete "phase/v2-11-finalization" || true
      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize_phase11_branch_cleanup.yml
          git commit -m "Remove final Phase 11 cleanup workflow"
          git push origin HEAD:main
