# Temporary, single-purpose workflow for user-authorized branch cleanup.
# Delete this workflow after its successful run.
name: MonReader retire six legacy branches
on:
  push:
    branches: [proofread]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: monreader-retire-legacy-branches
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify immutable protected refs and six target heads
        shell: bash
        run: |
          set -euo pipefail
          expected_main="7bee114279c299a27d0f375e2ff0299e5681facf"
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          proofread_sha="$(gh api "repos/$GH_REPO/git/ref/heads/proofread" --jq '.object.sha')"
          if [[ "$main_sha" != "$expected_main" || "$proofread_sha" != "$GITHUB_SHA" ]]; then
            echo "Protected branch changed: refusing cleanup"; exit 1
          fi
          targets=("experiment/phase5-perfect-convergence" "historical/pre-v2-reset-2026-09-30" "phase/01-foundation" "phase/02-data-ingestion" "phase/03-splits" "phase/04-baselines")
          expected=("b360ebd03fb38986774e8b7ca640458edf683653" "f1d2c76d04c8f5122a12bfcbd8d1b8515617e266" "90e4752b6eff63e5e33aca0e0a0a7cfa9d7f89a5" "3316a48444d03819efcc8e46a18562231f7443d4" "824abacb39b2c90aed2d0e3960f04f9cb3fcc023" "e2148c267a9c607d57a8b5bcf775f896d83f6a45")
          for i in "${!targets[@]}"; do
            b="${targets[$i]}"
            if [[ "$b" == "main" || "$b" == "proofread" ]]; then echo "Protected target"; exit 1; fi
            sha="$(gh api "repos/$GH_REPO/git/ref/heads/$b" --jq '.object.sha')"
            if [[ "$sha" != "${expected[$i]}" ]]; then
              echo "Branch $b changed: refusing cleanup"; exit 1
            fi
            echo "Validated $b at $sha"
          done
      - name: Delete only the six verified legacy branches
        shell: bash
        run: |
          set -euo pipefail
          targets=("experiment/phase5-perfect-convergence" "historical/pre-v2-reset-2026-09-30" "phase/01-foundation" "phase/02-data-ingestion" "phase/03-splits" "phase/04-baselines")
          expected=("b360ebd03fb38986774e8b7ca640458edf683653" "f1d2c76d04c8f5122a12bfcbd8d1b8515617e266" "90e4752b6eff63e5e33aca0e0a0a7cfa9d7f89a5" "3316a48444d03819efcc8e46a18562231f7443d4" "824abacb39b2c90aed2d0e3960f04f9cb3fcc023" "e2148c267a9c607d57a8b5bcf775f896d83f6a45")
          for i in "${!targets[@]}"; do
            b="${targets[$i]}"
            if [[ "$b" == "main" || "$b" == "proofread" ]]; then echo "Protected target"; exit 1; fi
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$b" --jq '.object.sha')"
            if [[ "$actual" != "${expected[$i]}" ]]; then echo "Ref changed: $b"; exit 1; fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$b"
            echo "Deleted: $b"
          done
          remaining="$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' | sort)"
          expected_remaining="$(printf 'main\nproofread' | sort)"
          if [[ "$remaining" != "$expected_remaining" ]]; then
            echo "Unexpected remaining branches:"; echo "$remaining"; exit 1
          fi
          echo "PASS: only main and proofread remain"
