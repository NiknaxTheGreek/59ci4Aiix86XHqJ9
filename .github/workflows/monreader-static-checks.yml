name: MonReader reproducibility checks
on:
  push:
    branches: [main, proofread]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check notebook and Python syntax, README and figures
        run: python scripts/check_static.py
      - name: Verify accepted eight-run results and notebook gates
        run: python scripts/verify_progressive_report.py
