name: MonReader static quality checks
on:
  push:
    branches: [proofread]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tracked source and notebook syntax
        run: python scripts/check_static.py
      - name: Verify T/ST completed-report evidence consistency
        run: python scripts/verify_progressive_report.py
