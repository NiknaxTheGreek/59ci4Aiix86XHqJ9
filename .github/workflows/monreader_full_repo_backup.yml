name: MonReader Full Repository Backup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/monreader_full_repo_backup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch all refs
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force
          git show-ref | sort > /tmp/MONREADER_ALL_REFS.txt
          git log --all --oneline --decorate --graph > /tmp/MONREADER_ALL_HISTORY.txt
          git status --short --branch > /tmp/MONREADER_BACKUP_STATUS.txt

      - name: Create and verify full repository bundle
        run: |
          set -euo pipefail
          git bundle create /tmp/MONREADER_FULL_REPO_2026-10-07.bundle --all
          git bundle verify /tmp/MONREADER_FULL_REPO_2026-10-07.bundle
          sha256sum /tmp/MONREADER_FULL_REPO_2026-10-07.bundle > /tmp/MONREADER_FULL_REPO_2026-10-07.bundle.sha256

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONREADER_FULL_REPO_BACKUP_2026-10-07
          path: |
            /tmp/MONREADER_FULL_REPO_2026-10-07.bundle
            /tmp/MONREADER_FULL_REPO_2026-10-07.bundle.sha256
            /tmp/MONREADER_ALL_REFS.txt
            /tmp/MONREADER_ALL_HISTORY.txt
            /tmp/MONREADER_BACKUP_STATUS.txt
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
