name: One-time final Phase 11 branch cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one_time_phase11_branch_cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete final obsolete limb-development branch
        run: |
          set -euo pipefail
          git push origin --delete "experiment/v2-secondary-perturbation-dev" || true

      - name: Remove one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one_time_phase11_branch_cleanup.yml
          git commit -m "Remove one-time Phase 11 cleanup workflow"
          git push origin HEAD:main
