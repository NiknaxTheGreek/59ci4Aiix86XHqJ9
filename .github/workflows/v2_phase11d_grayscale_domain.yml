name: MonReader V2 Phase 11D full-corpus grayscale domain

on:
  push:
    branches: ["phase/v2-11d-grayscale-domain"]
    paths:
      - ".github/workflows/v2_phase11d_grayscale_domain.yml"
      - "scripts/audit_grayscale_full_corpus_v2.py"
      - "scripts/train_evaluate_grayscale_domain_v2.py"
      - "src/chroma_counterfactual_v2.py"
      - "src/scratch_v2.py"
      - "protocol/SECONDARY_GRAYSCALE_DOMAIN_V2.md"
      - "configs/MONREADER_FIXED_20_CONFIG_BANK.json"
      - "manifests/datasets/DATA-001.csv"
      - "manifests/splits/*.csv"
      - "results/secondary/chroma_eval/*.csv"

permissions:
  contents: write

env:
  DATASET_FILE_ID: 1kq6_jqeOLnBPN5_8cpT6amto589kFqlI
  DATASET_SHA256: 033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f
  PYTHONPATH: "."
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"

jobs:
  audit-full-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install pinned audit runtime
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 Pillow==12.3.0 gdown==5.2.0

      - name: Compile frozen grayscale audit
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/chroma_counterfactual_v2.py \
            scripts/audit_grayscale_full_corpus_v2.py

      - name: Download and verify authoritative 2,989-image archive
        run: |
          set -euo pipefail
          rm -f /tmp/images.zip
          # gdown handles Google Drive's large-file confirmation flow, which can
          # otherwise return a small HTML response with HTTP 200 to plain curl.
          for attempt in 1 2 3 4 5; do
            if python -m gdown \
              --continue \
              "https://drive.google.com/uc?id=$DATASET_FILE_ID" \
              --output /tmp/images.zip; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::gdown failed after 5 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -s /tmp/images.zip
          archive_bytes="$(stat --printf='%s' /tmp/images.zip)"
          if [ "$archive_bytes" -lt 100000000 ]; then
            echo "::error::Dataset download is implausibly small: ${archive_bytes} bytes"
            file /tmp/images.zip || true
            head -c 512 /tmp/images.zip | strings || true
            exit 1
          fi
          printf '%s  %s\n' "$DATASET_SHA256" /tmp/images.zip | sha256sum --check
          stat --printf='archive_bytes=%s\n' /tmp/images.zip

      - name: Preserve verified authoritative archive for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: v2-authoritative-images-zip
          path: /tmp/images.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Transform and audit all 2,989 source images
        run: |
          set -euo pipefail
          rm -rf /tmp/grayscale-audit
          python -m scripts.audit_grayscale_full_corpus_v2 \
            --archive /tmp/images.zip \
            --manifest manifests/datasets/DATA-001.csv \
            --metadata manifests/splits/O.csv \
            --output-dir /tmp/grayscale-audit
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("/tmp/grayscale-audit/GRAYSCALE_FULL_CORPUS_SUMMARY.json").read_text())
          assert s["status"] == "PASS_FULL_CORPUS_GRAYSCALE_AUDIT"
          assert s["images_transformed"] == 2989
          assert s["decode_transform_failures"] == 0
          assert s["shape_preserved"] == 2989
          assert s["three_output_channels_identical"] == 2989
          print("FULL_CORPUS_GATE=PASS 2989/2989")
          PY
          sha256sum /tmp/grayscale-audit/*

      - name: Upload full-corpus grayscale audit and visual QA
        uses: actions/upload-artifact@v4
        with:
          name: v2-grayscale-full-corpus-audit
          path: /tmp/grayscale-audit
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

  train-domain:
    needs: audit-full-corpus
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - regime: O
            candidate: C14
            membership: manifests/splits/O.csv
            testtime_gray_predictions: results/secondary/chroma_eval/O_predictions.csv
          - regime: S
            candidate: C18
            membership: manifests/splits/S.csv
            testtime_gray_predictions: results/secondary/chroma_eval/S_predictions.csv
          - regime: T
            candidate: C06
            membership: manifests/splits/T.csv
            testtime_gray_predictions: results/secondary/chroma_eval/T_predictions.csv
          - regime: ST
            candidate: C07
            membership: manifests/splits/ST.csv
            testtime_gray_predictions: results/secondary/chroma_eval/ST_predictions.csv

    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install pinned CPU training runtime
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 Pillow==12.3.0 scikit-learn==1.9.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.10.0 torchvision==0.25.0

      - name: Compile exact committed implementation
        run: |
          set -euo pipefail
          python -m compileall -q \
            src/scratch_v2.py \
            src/chroma_counterfactual_v2.py \
            scripts/train_evaluate_grayscale_domain_v2.py

      - name: Download passed 2,989-image audit
        uses: actions/download-artifact@v4
        with:
          name: v2-grayscale-full-corpus-audit
          path: /tmp/grayscale-audit

      - name: Download verified authoritative archive from audit job
        uses: actions/download-artifact@v4
        with:
          name: v2-authoritative-images-zip
          path: /tmp

      - name: Re-verify authoritative archive identity
        run: |
          set -euo pipefail
          test -s /tmp/images.zip
          printf '%s  %s\n' "$DATASET_SHA256" /tmp/images.zip | sha256sum --check
          stat --printf='archive_bytes=%s\n' /tmp/images.zip

      - name: Train and evaluate one frozen champion config in grayscale domain
        run: |
          set -euo pipefail
          rm -rf "/tmp/gray-${{ matrix.regime }}"
          python -m scripts.train_evaluate_grayscale_domain_v2 \
            --regime "${{ matrix.regime }}" \
            --candidate-id "${{ matrix.candidate }}" \
            --archive /tmp/images.zip \
            --manifest manifests/datasets/DATA-001.csv \
            --membership "${{ matrix.membership }}" \
            --bank configs/MONREADER_FIXED_20_CONFIG_BANK.json \
            --audit-manifest /tmp/grayscale-audit/GRAYSCALE_FULL_CORPUS_MANIFEST.csv \
            --testtime-gray-predictions "${{ matrix.testtime_gray_predictions }}" \
            --output-dir "/tmp/gray-${{ matrix.regime }}"
          sha256sum "/tmp/gray-${{ matrix.regime }}"/*

      - name: Upload regime grayscale-domain evidence
        uses: actions/upload-artifact@v4
        with:
          name: v2-grayscale-domain-${{ matrix.regime }}
          path: /tmp/gray-${{ matrix.regime }}
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [audit-full-corpus, train-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download full-corpus audit
        uses: actions/download-artifact@v4
        with:
          name: v2-grayscale-full-corpus-audit
          path: /tmp/grayscale-audit

      - name: Download all four regime results
        uses: actions/download-artifact@v4
        with:
          pattern: v2-grayscale-domain-*
          path: /tmp/grayscale-regimes
          merge-multiple: false

      - name: Build combined scientific report
        run: |
          set -euo pipefail
          for R in O S T ST; do
            D="/tmp/grayscale-regimes/v2-grayscale-domain-${R}"
            test -s "$D/${R}_summary.json"
            test -s "$D/${R}_predictions.csv"
            test -s "$D/${R}_training_metadata.json"
            test -s "$D/${R}_report.md"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/grayscale-regimes")
          regimes=["O","S","T","ST"]
          summaries={}
          for r in regimes:
              p=root/f"v2-grayscale-domain-{r}"/f"{r}_summary.json"
              summaries[r]=json.loads(p.read_text())

          audit=json.loads(
              Path("/tmp/grayscale-audit/GRAYSCALE_FULL_CORPUS_SUMMARY.json").read_text()
          )
          assert audit["images_transformed"] == 2989
          assert audit["decode_transform_failures"] == 0

          lines=[
              "# Phase 11D — Full-corpus grayscale-domain ablation",
              "",
              "**Full-corpus transform gate: PASS — 2,989/2,989 images transformed, 0 failures.**",
              "",
              "Real MonReader ORIGINAL → GRAYSCALE examples were visually inspected and accepted by the user before this full run.",
              "",
              "| Regime | Frozen config | RGB→RGB F1 | RGB→Gray F1 | Gray→Gray F1 | Δ Gray→Gray vs RGB→RGB |",
              "|---|---:|---:|---:|---:|---:|",
          ]
          for r in regimes:
              s=summaries[r]
              m=s["metrics"]
              a=m["original_rgb_trained_rgb_tested"]["f1"]
              b=m["rgb_trained_grayscale_tested"]["f1"]
              c=m["grayscale_trained_grayscale_tested"]["f1"]
              lines.append(
                  f"| {r} | {s['candidate_id']} | {a:.4f} | {b:.4f} | {c:.4f} | {c-a:+.4f} |"
              )

          lines += ["", "## Video/group paired-bootstrap intervals", ""]
          for r in regimes:
              s=summaries[r]
              lines.append(f"### {r}")
              for key, label in [
                  ("grayscale_domain_minus_original_rgb", "Gray→Gray minus RGB→RGB"),
                  ("testtime_grayscale_minus_original_rgb", "RGB→Gray minus RGB→RGB"),
                  ("grayscale_domain_minus_testtime_grayscale", "Gray→Gray minus RGB→Gray"),
              ]:
                  b=s["bootstrap"][key]
                  ci=b["video_group_delta_f1_ci95"]
                  lines.append(
                      f"- {label}: {b['observed_delta_f1']:+.4f} "
                      f"(95% CI [{ci[0]:+.4f}, {ci[1]:+.4f}])"
                  )
              lines.append("")

          lines += [
              "## Interpretation boundary",
              "",
              "This is a post-selection secondary analysis. It cannot replace or reopen the frozen primary O/S/T/ST champions.",
              "It distinguishes abrupt test-time grayscale shift from performance after training adaptation to the grayscale domain.",
              "",
          ]

          out=Path("/tmp/GRAYSCALE_DOMAIN_REPORT.md")
          out.write_text("\n".join(lines)+"\n")
          Path("/tmp/GRAYSCALE_DOMAIN_COMBINED_SUMMARY.json").write_text(
              json.dumps({
                  "status":"PHASE11D_GRAYSCALE_DOMAIN_COMPLETE",
                  "selection_bearing":False,
                  "full_corpus_audit":audit,
                  "regimes":summaries,
              },indent=2,sort_keys=True)+"\n"
          )
          PY

      - name: Publish compact evidence to branch
        run: |
          set -euo pipefail
          DEST=results/secondary/grayscale_domain
          mkdir -p "$DEST/qa" reports/secondary

          cp /tmp/grayscale-audit/GRAYSCALE_FULL_CORPUS_SUMMARY.json "$DEST/"
          cp /tmp/grayscale-audit/GRAYSCALE_FULL_CORPUS_MANIFEST.csv "$DEST/"
          cp /tmp/grayscale-audit/GRAYSCALE_QA_SAMPLE_32.csv "$DEST/"
          cp /tmp/grayscale-audit/grayscale_qa_*.jpg "$DEST/qa/"

          for R in O S T ST; do
            SRC="/tmp/grayscale-regimes/v2-grayscale-domain-${R}"
            cp "$SRC/${R}_summary.json" "$DEST/"
            cp "$SRC/${R}_predictions.csv" "$DEST/"
            cp "$SRC/${R}_training_metadata.json" "$DEST/"
            cp "$SRC/${R}_report.md" "$DEST/"
          done

          cp /tmp/GRAYSCALE_DOMAIN_COMBINED_SUMMARY.json "$DEST/combined_summary.json"
          cp /tmp/GRAYSCALE_DOMAIN_REPORT.md reports/secondary/GRAYSCALE_DOMAIN_REPORT.md

          sha256sum "$DEST"/*.json "$DEST"/*.csv "$DEST/qa"/*.jpg \
            reports/secondary/GRAYSCALE_DOMAIN_REPORT.md \
            > "$DEST/SHA256SUMS.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST" reports/secondary/GRAYSCALE_DOMAIN_REPORT.md
          git commit -m "Phase 11D: publish full-corpus grayscale-domain results [skip ci]"
          git push origin HEAD:phase/v2-11d-grayscale-domain

      - name: Upload combined evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-phase11d-grayscale-domain
          path: |
            /tmp/grayscale-audit
            /tmp/grayscale-regimes
            /tmp/GRAYSCALE_DOMAIN_REPORT.md
            /tmp/GRAYSCALE_DOMAIN_COMBINED_SUMMARY.json
          compression-level: 1
          retention-days: 90
          if-no-files-found: error
