"14" font-weight="700" fill="#15253a" text-anchor="start">CONTEXT</text><text x="986" y="675" font-size="28" font-weight="700" fill="#15253a" text-anchor="start">489</text><text x="986" y="698" font-size="13" font-weight="400" fill="#617089" text-anchor="start">Unseen early frames</text><rect x="1196" y="612" width="214" height="100" rx="11" fill="#ffe5d8" stroke="#c5d1dd"/><text x="1212" y="640" font-size="14" font-weight="700" fill="#15253a" text-anchor="start">TEST</text><text x="1212" y="675" font-size="28" font-weight="700" fill="#15253a" text-anchor="start">121</text><text x="1212" y="698" font-size="13" font-weight="400" fill="#617089" text-anchor="start">Unseen late frames</text><text x="972" y="734" font-size="13" font-weight="600" fill="#786038" text-anchor="start">489 + 121 = 610 frames from 24 withheld recordings; none used for fitting</text><text x="36" y="779" font-size="15" font-weight="500" fill="#617089" text-anchor="start">ST's 121 test frames are the final ≈20% within each withheld recording; the 489 earlier frames remain context only.</text></g></svg>
